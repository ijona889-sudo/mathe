name: Android APK bauen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v5

      - name: Java 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: APK bauen
        run: bash ./gradlew --no-daemon :app:assembleDebug

      - name: APK zum Download bereitstellen
        uses: actions/upload-artifact@v5
        with:
          name: Mathegenerator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
